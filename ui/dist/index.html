<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Voice-to-Rx</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --dim:#9aa3b2; --accent:#4f8cff; --ok:#31c48d;
    --warn:#f0a202; --danger:#f05252;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dde1e7;
           --txt:#1a1d23; --dim:#5b6472; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt)}
  header{padding:16px 22px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{padding:7px 14px;border-radius:7px;border:1px solid transparent;
       background:none;color:var(--dim);cursor:pointer;font-size:14px;font-weight:500}
  .tab.on{background:var(--panel2);color:var(--txt);border-color:var(--line)}
  main{padding:22px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:18px;margin-bottom:16px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .col{flex:1;min-width:280px}
  button.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.rec{background:var(--danger)}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:32px;
        text-align:center;color:var(--dim);cursor:pointer}
  .drop:hover{border-color:var(--accent);color:var(--txt)}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--dim);margin:0 0 9px;font-weight:650}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--dim);
     padding:7px 9px;border-bottom:1px solid var(--line);letter-spacing:.05em}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;
        font-weight:600;letter-spacing:.02em}
  .pill.ok{background:rgba(49,196,141,.16);color:var(--ok)}
  .pill.warn{background:rgba(240,162,2,.16);color:var(--warn)}
  .pill.danger{background:rgba(240,82,82,.16);color:var(--danger)}
  ul.clean{margin:0;padding-left:19px}
  ul.clean li{margin:3px 0}
  .muted{color:var(--dim)}
  .warnbox{background:rgba(240,162,2,.10);border:1px solid rgba(240,162,2,.35);
           border-radius:9px;padding:13px;margin-bottom:16px}
  .bn{font-size:15px;line-height:1.75}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
        border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
        vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  textarea{width:100%;background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit}
  .seg{border:1px solid var(--line);border-radius:9px;padding:13px;margin-bottom:11px;
       background:var(--panel2)}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:13px}
  input.cell{width:100%;background:transparent;color:var(--txt);border:1px solid transparent;
    border-radius:6px;padding:5px 6px;font:inherit}
  input.cell:hover{border-color:var(--line)}
  input.cell:focus{outline:none;border-color:var(--accent);background:var(--panel2)}
  input.cell::placeholder{color:var(--dim);opacity:.6}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect} = React;
const API = "";

function Pill({kind,children}){ return <span className={"pill "+kind}>{children}</span>; }

// The model annotates uncertain drug names inline:
//   "এস্কোরিল (possible medication name, ASR unclear, needs human verification)"
// The match is correct but the parenthetical belongs in the review reason,
// not in the drug column of a prescription.
function cleanDrug(name){
  return String(name||"").replace(/\s*\((?:possible|likely|probable|uncertain)[^)]*\)/gi,"").trim();
}

function Rx({data}){
  // Editable working copy. The doctor is the author of the prescription;
  // everything the pipeline produced is a draft they correct in place.
  const [meds,setMeds]=useState([]);
  const [dx,setDx]=useState("");
  const [dirty,setDirty]=useState(false);

  useEffect(()=>{
    if(!data){ setMeds([]); setDx(""); return; }
    // Drug candidates found in garbled audio are shown as MEDICATION ROWS,
    // not in a separate box. They were being missed entirely because a
    // reviewer had to notice a second panel and retype the name; as rows
    // they are one edit away from being correct.
    const fromCandidates=(data.drug_candidates||[]).map(c=>{
      const m=/^'([^']+)'\s*may be\s*([^(]+)/.exec(c)||[];
      return {drug:(m[1]||c).trim(), canonical:(m[2]||"").trim(),
              dosage:"", frequency:"", duration:"",
              tier:"probable", verified:false, match_similarity:null,
              review_reason:"heard in audio, not confirmed"};
    });
    const base=(data.medications||[]).map(m=>({...m, drug:cleanDrug(m.drug)}));
    const seen=new Set(base.map(m=>(m.canonical||m.drug).toLowerCase()));
    setMeds([...base, ...fromCandidates.filter(c=>{
      const k=(c.canonical||c.drug).toLowerCase();
      if(seen.has(k)) return false; seen.add(k); return true;
    })]);
    setDx(data.diagnosis||"");
    setDirty(false);
  },[data]);

  function edit(i,field,value){
    setMeds(ms=>ms.map((m,j)=>j===i?{...m,[field]:value}:m)); setDirty(true);
  }
  function addRow(){
    setMeds(ms=>[...ms,{drug:"",dosage:"",frequency:"",duration:"",
                        tier:"manual",verified:true,review_reason:"added by clinician"}]);
    setDirty(true);
  }
  function removeRow(i){ setMeds(ms=>ms.filter((_,j)=>j!==i)); setDirty(true); }

  if(!data) return null;
  const flagged = data.segments_flagged>0;
  return (
    <div>
      {flagged && (
        <div className="warnbox">
          <strong>⚠ {data.segments_flagged} of {data.segments_total} segments need human review.</strong>
          <div className="muted" style={{marginTop:6,fontSize:13}}>
            This is a draft, not a prescription. A clinician must confirm before use.
          </div>
          {data.review_reasons?.length>0 && (
            <ul className="clean muted" style={{marginTop:8,fontSize:13}}>
              {data.review_reasons.slice(0,6).map((r,i)=><li key={i}>{r}</li>)}
            </ul>
          )}
        </div>
      )}

      {/* The separate "possible drug names" panel is gone: those entries
          are now editable rows in the Medications table, where they can be
          corrected in one step instead of being retyped. */}

      <div className="row">
        <div className="col card">
          <h3>Patient</h3>
          <div style={{fontSize:17,fontWeight:600}}>
            {data.patient_name || <span className="muted">Not stated in audio</span>}
          </div>
          {/* Editable. The model only fills this when the doctor states a
              diagnosis outright, which in practice is rare - so it is a
              field to complete, not a read-only result. */}
          <h3 style={{marginTop:16}}>Diagnosis</h3>
          <input value={dx} onChange={e=>{setDx(e.target.value); setDirty(true);}}
                 placeholder="e.g. diabetic, cardiac — ischaemic heart disease"
                 style={{width:"100%",background:"var(--panel2)",color:"var(--txt)",
                         border:"1px solid var(--line)",borderRadius:7,padding:"9px 10px",
                         font:"inherit"}}/>
          {!data.diagnosis && (
            <div className="muted" style={{fontSize:12,marginTop:5}}>
              Not stated outright in the audio — please complete.
            </div>)}
          <h3 style={{marginTop:16}}>Summary</h3>
          <div className="muted">{data.summary || "—"}</div>
        </div>

        <div className="col card">
          <h3>Symptoms</h3>
          {data.symptoms?.length ? (
            <ul className="clean bn">{data.symptoms.map((s,i)=><li key={i}>{s}</li>)}</ul>
          ) : <span className="muted">None extracted</span>}

          {/* Shown separately and greyed: the model asserted these but the
              transcript does not support them. Mixing them into Symptoms
              is how "loose stools" reached a cataract prescription. */}
          {data.symptoms_unconfirmed?.length>0 && (
            <>
              <h3 style={{marginTop:16,color:"var(--warn)"}}>
                Not heard in the audio — check</h3>
              <ul className="clean muted" style={{fontSize:13}}>
                {data.symptoms_unconfirmed.map((s,i)=><li key={i}>{s}</li>)}
              </ul>
            </>)}

          <h3 style={{marginTop:16}}>Lab tests ordered</h3>
          {data.labs_ordered?.length ? (
            <ul className="clean">{data.labs_ordered.map((s,i)=><li key={i}>{s}</li>)}</ul>
          ) : <span className="muted">None</span>}

          <h3 style={{marginTop:16}}>Follow-up</h3>
          <div className="muted">{data.follow_up || "—"}</div>
        </div>
      </div>

      <div className="card">
        <h3>Medications</h3>
        {meds.length ? (
          <table>
            <thead><tr><th style={{width:"30%"}}>Drug</th><th>Dosage</th><th>Frequency</th>
              <th>Duration</th><th style={{width:130}}>Source</th><th></th></tr></thead>
            <tbody>
              {meds.map((m,i)=>(
                <tr key={i}>
                  <td>
                    <input value={m.drug} onChange={e=>edit(i,"drug",e.target.value)}
                           className="cell" style={{fontWeight:600}}/>
                    {/* The gazetteer's canonical name stays a SUGGESTION
                        under what was actually said. Clicking it accepts
                        it - the doctor decides, the system never rewrites
                        a drug name on its own. */}
                    {m.canonical && m.canonical!==m.drug && (
                      <div className="muted" style={{fontSize:"0.85em",marginTop:3}}>
                        {m.tier==="verified" ? "= " : "possibly "}
                        <a href="#" onClick={e=>{e.preventDefault();edit(i,"drug",m.canonical);}}
                           style={{color:"var(--accent)"}}>{m.canonical}</a>
                        {m.indication ? ` — ${m.indication}` : ""}
                      </div>)}
                  </td>
                  <td><input value={m.dosage||""} placeholder="500mg"
                             onChange={e=>edit(i,"dosage",e.target.value)} className="cell"/></td>
                  <td><input value={m.frequency||""} placeholder="BD / after lunch"
                             onChange={e=>edit(i,"frequency",e.target.value)} className="cell"/></td>
                  <td><input value={m.duration||""} placeholder="7 days"
                             onChange={e=>edit(i,"duration",e.target.value)} className="cell"/></td>
                  <td>{m.tier==="manual"
                        ? <Pill kind="ok">you added</Pill>
                        : m.tier==="probable"
                          ? <Pill kind="warn">confirm{m.match_similarity?` (${m.match_similarity})`:""}</Pill>
                          : m.verified
                            ? <Pill kind="ok">known drug</Pill>
                            : <Pill kind="danger">unverified</Pill>}
                      {m.review_reason && (
                        <div className="muted" style={{fontSize:11,marginTop:3}}>{m.review_reason}</div>)}
                  </td>
                  <td><button onClick={()=>removeRow(i)} title="remove"
                        style={{background:"none",border:0,color:"var(--dim)",
                                cursor:"pointer",fontSize:17}}>×</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        ) : <span className="muted">Nothing detected — add any medication you prescribed.</span>}
        <div style={{marginTop:12,display:"flex",gap:12,alignItems:"center"}}>
          <button onClick={addRow} style={{background:"var(--panel2)",color:"var(--txt)",
                  border:"1px solid var(--line)",borderRadius:7,padding:"7px 13px",
                  cursor:"pointer",font:"inherit"}}>+ Add medication</button>
          {dirty && <span className="muted" style={{fontSize:12}}>edited — not yet saved</span>}
        </div>
      </div>

      {data.raw_uncertain_terms?.length>0 && (
        <div className="card">
          <h3>Uncertain terms — not interpreted</h3>
          <ul className="clean bn muted">
            {data.raw_uncertain_terms.map((t,i)=><li key={i}>{t}</li>)}
          </ul>
        </div>
      )}

      {/* Shown, not hidden. These were proposed as medications and refused
          by the gazetteer. Surfacing them is the only way a reviewer can
          catch the gate being WRONG - a silent drop would look identical to
          a term that was never extracted at all. */}
      {data.rejected_terms?.length>0 && (
        <div className="card">
          <h3>Rejected as medications</h3>
          <p className="muted" style={{marginTop:0,fontSize:13}}>
            The model proposed these as drugs; the clinical gazetteer refused
            them. Check for anything that is genuinely a medication.
          </p>
          <ul className="clean bn muted">
            {data.rejected_terms.map((t,i)=><li key={i}>{t}</li>)}
          </ul>
        </div>
      )}

      <div className="card">
        <h3>Transcript by segment</h3>
        {data.segments?.map((s,i)=>(
          <div className="seg" key={i}>
            <div className="muted" style={{fontSize:12,marginBottom:5}}>
              {s.start_s?.toFixed(1)}s – {s.end_s?.toFixed(1)}s · {s.decoder_used}
              {" · agreement "}{s.decoder_agreement}
              {s.corrections_applied?.length>0 &&
                <span> · <span style={{color:"var(--ok)"}}>
                  {s.corrections_applied.length} auto-corrected</span></span>}
            </div>
            <div className="bn">{s.corrected_text}</div>
            {s.corrections_applied?.length>0 && (
              <div className="muted" style={{fontSize:12,marginTop:5}}>
                {s.corrections_applied.join(", ")}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function Record(){
  const [busy,setBusy]=useState(false);
  const [rec,setRec]=useState(false);
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  const [progress,setProgress]=useState(null);
  const mr=useRef(null), chunks=useRef([]), fileIn=useRef(null), sid=useRef(null);

  async function send(blob,name){
    setBusy(true); setErr(null); setData(null);
    try{
      const fd=new FormData(); fd.append("file",blob,name);
      const r=await fetch(API+"/api/transcribe",{method:"POST",body:fd});
      if(!r.ok) throw new Error("Server returned "+r.status);
      setData(await r.json());
    }catch(e){ setErr(e.message); }
    finally{ setBusy(false); }
  }

  // STREAMING CAPTURE.
  // Chunks are uploaded DURING the consultation and transcribed as they
  // arrive, so pressing Stop only has the final chunk left to process.
  // The old design did all the work after Stop, which meant ~60s of
  // waiting on a real consultation.
  async function startRec(){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{
        channelCount:1, echoCancellation:true, noiseSuppression:true}});

      const s=await fetch(API+"/api/session/start",{method:"POST"});
      if(!s.ok) throw new Error("could not start session");
      const {session_id,chunk_seconds}=await s.json();
      sid.current=session_id; setErr(null); setData(null); setProgress(null);

      const m=new MediaRecorder(stream);
      // Chunks are uploaded in order and awaited one at a time. The server
      // appends them to a single growing file, because MediaRecorder only
      // puts the container header in the FIRST chunk - later ones cannot
      // be decoded on their own, and out-of-order arrival would corrupt
      // the stream.
      let queue=Promise.resolve();
      m.ondataavailable=e=>{
        if(!e.data.size) return;
        queue=queue.then(async()=>{
          try{
            const fd=new FormData();
            fd.append("file",e.data,"chunk.webm");
            const r=await fetch(API+"/api/session/"+sid.current+"/chunk",
                                {method:"POST",body:fd});
            if(r.ok){ const j=await r.json(); setProgress(j); }
          }catch(_){ /* a dropped chunk must not stop the recording */ }
        });
      };
      m.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        setBusy(true);
        try{
          await queue;                    // let in-flight chunks land first
          const r=await fetch(API+"/api/session/"+sid.current+"/finalize",
                              {method:"POST"});
          if(!r.ok) throw new Error("Server returned "+r.status);
          setData(await r.json());
        }catch(e){ setErr(e.message); }
        finally{ setBusy(false); setProgress(null); }
      };
      mr.current=m;
      m.start((chunk_seconds||10)*1000);   // emit a chunk every N seconds
      setRec(true);
    }catch(e){ setErr("Microphone blocked: "+e.message); }
  }
  function stopRec(){ mr.current?.stop(); setRec(false); }

  return (
    <div>
      <div className="card">
        <div className="row" style={{alignItems:"center"}}>
          <button className={"primary "+(rec?"rec":"")} disabled={busy}
                  onClick={rec?stopRec:startRec}>
            {rec ? "■ Stop recording" : "● Record from microphone"}
          </button>
          <span className="muted">or</span>
          <button className="primary" style={{background:"var(--panel2)",
                  color:"var(--txt)",border:"1px solid var(--line)"}}
                  disabled={busy} onClick={()=>fileIn.current.click()}>
            Upload a recording
          </button>
          <input ref={fileIn} type="file" accept="audio/*" style={{display:"none"}}
                 onChange={e=>{const f=e.target.files[0]; if(f) send(f,f.name);}}/>
          {rec && <span style={{color:"var(--danger)",fontWeight:600}}>● recording…</span>}
        </div>
        {/* Live progress while recording. Shown because the work is now
            happening DURING the consultation - without this the user has
            no way to tell that transcription is keeping up. */}
        {rec && progress && !progress.pending && (
          <div className="muted" style={{marginTop:12,fontSize:13}}>
            transcribed {progress.segments_done} segment(s) so far
            {progress.audio_s ? ` · ${progress.audio_s}s audio in ${progress.compute_s}s compute` : ""}
          </div>)}
        {busy && <div style={{marginTop:14}}><span className="spin"></span>
          Finishing the last segment…</div>}
        {err && <div style={{marginTop:14,color:"var(--danger)"}}>{err}</div>}
        {data && <div className="muted" style={{marginTop:12,fontSize:13}}>
          {data.click_to_result_s!=null
            ? <>Ready {data.click_to_result_s}s after you pressed Stop · {data.segments_total} segments
                <span className="muted"> (transcribed live during the consultation)</span></>
            : <>Processed in {data.processing_s}s · {data.segments_total} segments</>}</div>}
      </div>
      <Rx data={data}/>
    </div>
  );
}

function Review(){
  const [items,setItems]=useState([]);
  const [n,setN]=useState(0);
  const [load,setLoad]=useState(true);
  const [edits,setEdits]=useState({});

  async function refresh(){
    setLoad(true);
    try{
      const r=await fetch(API+"/api/review/pending");
      const d=await r.json(); setItems(d.pending||[]); setN(d.reviewed||0);
    }finally{ setLoad(false); }
  }
  useEffect(()=>{ refresh(); },[]);

  async function decide(seg,action){
    await fetch(API+"/api/review/"+encodeURIComponent(seg.segment_id),{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action, corrected_text: edits[seg.segment_id] ?? seg.transcript})
    });
    setItems(x=>x.filter(i=>i.segment_id!==seg.segment_id)); setN(v=>v+1);
  }

  if(load) return <div className="card"><span className="spin"></span>Loading…</div>;

  return (
    <div>
      <div className="card">
        <strong>{items.length} segments awaiting review</strong>
        <span className="muted"> · {n} already reviewed</span>
        <button className="primary" style={{marginLeft:16,padding:"6px 13px",fontSize:13}}
                onClick={refresh}>Refresh</button>
      </div>
      {items.length===0 && <div className="card muted">
        Nothing pending. Process a recording first.</div>}
      {items.map(s=>(
        <div className="card" key={s.segment_id}>
          <div className="muted" style={{fontSize:12,marginBottom:7}}>
            {s.consult_id} · {s.start_s?.toFixed(1)}s–{s.end_s?.toFixed(1)}s
          </div>
          <textarea rows={2} className="bn"
            value={edits[s.segment_id] ?? s.transcript}
            onChange={e=>setEdits({...edits,[s.segment_id]:e.target.value})}/>
          <div style={{marginTop:9}}>
            {s.review_reasons.map((r,i)=>
              <div key={i} className="muted" style={{fontSize:13}}>• {r}</div>)}
          </div>
          {s.drug_candidates?.length>0 && (
            <div className="warnbox" style={{marginTop:10,marginBottom:0}}>
              {s.drug_candidates.map((c,i)=><div key={i} style={{fontSize:13}}>{c}</div>)}
            </div>
          )}
          <div style={{marginTop:12,display:"flex",gap:8}}>
            <button className="primary" style={{background:"var(--ok)",padding:"8px 15px",
                    fontSize:14}} onClick={()=>decide(s,"approved")}>Approve</button>
            <button className="primary" style={{background:"var(--accent)",padding:"8px 15px",
                    fontSize:14}} onClick={()=>decide(s,"edited")}>Save edit</button>
            <button className="primary" style={{background:"var(--danger)",padding:"8px 15px",
                    fontSize:14}} onClick={()=>decide(s,"rejected")}>Reject</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("record");
  return (
    <div>
      <header>
        <h1>Voice-to-Rx <span className="muted" style={{fontWeight:400}}>
          · Bengali consultation → structured prescription</span></h1>
        <div className="tabs">
          <button className={"tab"+(tab==="record"?" on":"")}
                  onClick={()=>setTab("record")}>Record / Upload</button>
          <button className={"tab"+(tab==="review"?" on":"")}
                  onClick={()=>setTab("review")}>Review queue</button>
        </div>
      </header>
      <main>{tab==="record" ? <Record/> : <Review/>}</main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
